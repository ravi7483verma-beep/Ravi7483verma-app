name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Unzip if zip file is present
      - name: Unzip project source code
        run: |
          if [ -f "Ravi7483vermaPrototype.zip" ]; then
            unzip -o Ravi7483vermaPrototype.zip
          fi

      # 2. Build APK with Kotlin target fix
      - name: Make gradlew executable and build APK
        run: |
          if [ -d "Ravi7483vermaPrototype" ]; then
            cd Ravi7483vermaPrototype
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug -Pkotlin.compiler.jvmTarget=17

      # 3. Upload Generated APK
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
        
          
          
