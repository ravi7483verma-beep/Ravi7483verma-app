name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip project source code
        run: |
          if [ -f "Ravi7483vermaPrototype.zip" ]; then
            unzip -o Ravi7483vermaPrototype.zip
          fi

      - name: Make gradlew executable and build APK
        run: |
          if [ -d "Ravi7483vermaPrototype" ]; then
            cd Ravi7483vermaPrototype
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
