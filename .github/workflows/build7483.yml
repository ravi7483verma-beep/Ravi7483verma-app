name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Check & Unzip Zip file if present
      - name: Unzip project source code
        run: |
          if [ -f "Ravi7483vermaPrototype.zip" ]; then
            echo "Unzipping Ravi7483vermaPrototype.zip..."
            unzip -o Ravi7483vermaPrototype.zip
          else
            echo "No zip file found, using repository files directly."
          fi

      # 2. Check Directory & Grant Permissions & Build APK
      - name: Make gradlew executable and build APK
        run: |
          if [ -d "Ravi7483vermaPrototype" ]; then
            cd Ravi7483vermaPrototype
          fi
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: gradlew file not found!"
            ls -la
            exit 1
          fi

      # 3. Upload Output APK
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'


      
          

          
          
