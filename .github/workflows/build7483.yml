name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Zip फ़ाइल खोलें
      - name: Unzip project source code
        run: |
          if [ -f "Ravi7483vermaPrototype.zip" ]; then
            unzip -o Ravi7483vermaPrototype.zip
          fi

      # 2. फ़ाइलों के अंदर छुपे 1.8 को ऑटो-फ़िक्स करके 17 करें
      - name: Auto-fix JVM Target in project files
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/"1.8"/"17"/g' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i "s/'1.8'/'17'/g" {} +

      # 3. APK बिल्ड करें
      - name: Make gradlew executable and build APK
        run: |
          if [ -d "Ravi7483vermaPrototype" ]; then
            cd Ravi7483vermaPrototype
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      # 4. APK अपलोड करें
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
