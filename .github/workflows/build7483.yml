name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Zip फ़ाइल खोलें
      - name: Unzip project source code
        run: |
          if [ -f "Ravi7483vermaPrototype.zip" ]; then
            unzip -o Ravi7483vermaPrototype.zip
          fi

      # 2. Java और Kotlin वर्ज़न 17 फ़िक्स करें
      - name: Force Java 17 and Kotlin 17 Compatibility
        run: |
          find . -name "build.gradle*" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/"1.8"/"17"/g' {} +
          find . -name "build.gradle*" -exec sed -i "s/'1.8'/'17'/g" {} +

      # 3. APK बिल्ड करें
      - name: Make gradlew executable and build APK
        run: |
          if [ -d "Ravi7483vermaPrototype" ]; then
            cd Ravi7483vermaPrototype
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.compileOptions.sourceCompatibility=17 -Pandroid.compileOptions.targetCompatibility=17 -Pkotlin.compiler.jvmTarget=17

      # 4. APK अपलोड करें
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
          
          
